# ci.yml — pull-request and main CI for Rendlio.Analyzers.
#
# Gates enforced here:
#   1. Restore in locked mode: the committed packages.lock.json files still describe the graph
#      the pinned versions resolve to, content hashes included. A dependency that moved
#      underneath a pin fails here (NU1004) rather than being adopted with nothing to read.
#   2. Build with warnings-as-errors, on Linux and Windows.
#   3. The full test suite, including the conventions every shipped rule must satisfy.
#   4. Formatting: `dotnet format --verify-no-changes` — the .editorconfig rules the
#      compiler cannot see (charset, line endings, final newline, trailing whitespace).
#   5. Pack: the package contains EXACTLY the entries it ships — the analyzer at
#      analyzers/dotnet/cs, which is the only path NuGet reads, and nothing else. A pack that
#      silently stops producing it installs as a no-op; one that gains a lib/ folder ships a
#      reference assembly from a project whose whole point is that it ships no library.
#   6. The floor host: the package, installed into a throwaway consumer under the lowest .NET
#      SDK the README claims to support, still loads and still reports. Everything above runs
#      on the SDK global.json pins, which is the other end of the supported range.
#
# This workflow needs NO secrets. Keep it that way: releasing is a separate workflow with
# its own narrow permissions.
#
# Every `uses:` below is pinned to a commit SHA, with the tag it resolved to in the trailing
# comment. A tag is a pointer its owner can move; a SHA is the code that was actually reviewed.
# The exposure in THIS file is small — no secrets, a read-only token, nothing published — but the
# convention is repository-wide and release.yml is where it carries weight, so it is cheaper to
# hold everywhere than to remember where it matters. A test in tests/Rendlio.Analyzers.Tests
# fails the build if a workflow reintroduces a moving tag, and Dependabot moves the pins
# deliberately, in a pull request someone reads.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push to a pull request cancels its in-flight run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: build-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # An analyzer is loaded by whatever compiler host the consumer runs — .NET Framework
        # under Visual Studio on Windows, .NET under `dotnet build` anywhere. Both legs run
        # because a pack that only builds on one of them is a pack that breaks for half its
        # consumers.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The SDK version is pinned by global.json at the repository root.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        # Locked mode compares the graph against a lock file only when there is one to read: a
        # restore that finds none writes it and exits 0. So a deleted packages.lock.json turns
        # this gate off with a green run, and a test in tests/Rendlio.Analyzers.Tests fails the
        # build if any project stops carrying one.
        run: dotnet restore Rendlio.Analyzers.slnx --locked-mode

      - name: Build
        run: dotnet build Rendlio.Analyzers.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Rendlio.Analyzers.slnx --configuration Release --no-build --verbosity normal

      # The remaining gates are host-independent, so they run once rather than per leg.
      - name: Format check (.editorconfig)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Rendlio.Analyzers.slnx --verify-no-changes --verbosity diagnostic

      # Platform is passed explicitly so this line means the same thing on a developer's box as it
      # does here. Building the solution maps the platform onto its projects, which are AnyCPU, so
      # output lands in bin/Release; packing the project DIRECTLY takes an ambient Platform as a
      # global property instead, moves $(OutputPath) to bin/<platform>/Release, and fails NU5019
      # looking for a build nobody wrote there. A runner sets no Platform, so this is a no-op here
      # — it is on the line so that copying the line is enough.
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet pack src/Rendlio.Analyzers/Rendlio.Analyzers.csproj --configuration Release --no-build
          -p:Platform=AnyCPU --output ./artifacts

      # The gate is a script rather than a shell block here so that both workflows run the same one
      # and a package inspected by hand is inspected by the gate. It asserts the package's ENTIRE
      # entry list, not just that the analyzer path is present: `-p:IncludeBuildOutput=true` adds a
      # lib/ folder to a package whose whole point is that it ships no library, and a presence check
      # exits 0 on that.
      - name: Verify the package contains exactly what it ships
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash eng/verify-package-layout.sh "$(ls ./artifacts/Rendlio.Analyzers.*.nupkg)"

      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          if-no-files-found: error

  # =============================================================================================
  # The lowest compiler host this package claims to support.
  #
  # The README tells a consumer they need "Visual Studio 2022 17.8 or .NET SDK 8.0.100 and
  # upwards". Everything above runs on the SDK global.json pins, which is the OTHER end of that
  # range — so until this job existed the floor was a sentence nobody had ever executed.
  #
  # A static argument gets most of the way: the package compiles against Roslyn 4.8, a test fails
  # the build if the README's stated floor stops matching that pin, and compiling against 4.8 is
  # what makes calling a post-4.8 API impossible. What it cannot reach is AD0001 — an analyzer
  # that compiles and then throws inside an older host. That is a runtime property of one specific
  # compiler host, and running it is the only way to learn it.
  #
  # Its own job rather than a leg of the matrix above: it needs a second SDK installed, it consumes
  # the package instead of building the repository, and a failure here means something different
  # from a failure there — the package is fine and the README's floor is wrong, or vice versa.
  # =============================================================================================
  host-floor:
    # Static, and it has to be: a job's `name` can read github / needs / strategy / matrix / vars /
    # inputs and NOT env, so naming the SDK here would render the expression rather than the version.
    # The version it runs against is the first line of the env block below, and the step's log says
    # it too.
    name: host-floor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The floor the README states, and the framework a consumer on that SDK can target. Both move
      # together or not at all, so they are two lines in one place rather than two axes of a matrix
      # with one row.
      #
      # SDK_FLOOR is a NAMED CONVENTION, not just a variable: it is the one spelling of a second SDK
      # that SdkPin allows beside global.json, and it allows it only when the value is an exact
      # version. See the remarks on SdkPin.SetupStepViolations, and
      # PackGateTests.Every_workflow_running_the_host_floor_gate_names_the_version_the_readme_does,
      # which is what stops this number and the README's sentence parting company.
      SDK_FLOOR: '8.0.100'
      FRAMEWORK_FLOOR: net8.0

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Both SDKs: the pinned one builds and packs this repository, the floor one hosts the
      # consumer. global.json is what a bare `dotnet` in the worktree resolves, so the repository is
      # still built by its pin and nothing else; the scratch consumer carries a global.json of its
      # own naming the floor, with rollForward disabled so it cannot quietly roll up to the newer
      # one. That is why this is not the second copy of the pin SdkPin exists to reject — it is a
      # different SDK, installed alongside, and no build here resolves against it.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.SDK_FLOOR }}
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Rendlio.Analyzers.slnx --locked-mode

      - name: Build
        run: dotnet build Rendlio.Analyzers.slnx --configuration Release --no-restore

      # Platform for the reason the pack step above gives.
      - name: Pack
        run: >
          dotnet pack src/Rendlio.Analyzers/Rendlio.Analyzers.csproj --configuration Release --no-build
          -p:Platform=AnyCPU --output ./artifacts

      # Installs the package into two throwaway consumers under the floor SDK and asserts both
      # directions: one that breaks every documented rule must fail with RENDLIO001 and RENDLIO002,
      # one that breaks none must build clean, and neither may report AD0001. An analyzer that has
      # silently stopped loading is indistinguishable from a codebase with no violations, which is
      # why the clean direction alone would not be a check.
      # SDK_FLOOR and FRAMEWORK_FLOOR arrive from the job's env, so they are read by the shell rather
      # than pasted into it — the rule release.yml states about a `${{ }}` inside a `run:` block.
      - name: Prove the analyzer loads and reports on the floor host
        shell: bash
        run: >
          bash eng/verify-host-floor.sh
          "$(ls ./artifacts/Rendlio.Analyzers.*.nupkg)" "${SDK_FLOOR}" "${FRAMEWORK_FLOOR}"
