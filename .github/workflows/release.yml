# release.yml — publishes Rendlio.Analyzers to nuget.org.
#
# THE FILE NAME IS PART OF THE CREDENTIAL. nuget.org authenticates this workflow with a
# Trusted Publishing policy that pins the repository *and the workflow file name*, so
# renaming or moving this file does not break a setting somewhere — it revokes the only way
# this repository can publish. Add jobs here; do not rename the file.
#
# There is no API key. Publishing authenticates over OIDC: GitHub mints a short-lived token
# describing this exact repository and workflow, nuget.org validates it against the policy and
# returns a temporary key that expires in an hour. Nothing to store, rotate or leak — so
# `secrets` must never appear in this file, and a step that would print the temporary key is a
# defect. See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing.
#
# Every `uses:` below is pinned to a commit SHA, with the tag it resolved to in the trailing
# comment. This is the file where that matters: a step here runs in a job that can mint a key
# authorised to publish under this package's own name, and a moving tag means the code holding
# that key can change with no diff in this repository and no release of its own. `NuGet/login`
# is the sharpest case — it is the step the short-lived key is handed to. Move a pin the way
# Dependabot does, in a pull request someone reads; never widen one back to a tag.
#
# A release is a decision, not a consequence. The only thing that publishes is a human pushing
# a version tag; a branch push, a merge or a schedule must never reach the push step.
#
# `workflow_dispatch` is the rehearsal: it runs every gate and uploads the .nupkg for
# inspection, and skips authentication and publishing entirely. Use it to validate a version
# before tagging it. (It could not publish even if it tried — the policy is scoped to push.) It
# also REPORTS on the publishing identity without requiring one, because the identity guard is
# scoped to a tag push and the variable it reads is the piece of a release most likely to be
# missing — a rehearsal that could not mention it would be silent about the thing it exists for.

name: release

on:
  push:
    # A digit after the v, so `vnext` or a `verify-…` branch tag does not start a release run that
    # exists only to die at the shape check below. Still deliberately looser than the real grammar:
    # anything that gets past this is rejected there, with a sentence saying what a tag should be.
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and validate, without the leading "v". Nothing is published.'
        required: true
        type: string

# Least privilege by default; the publish job adds the one permission it needs and no more.
permissions:
  contents: read

# Two runs for one tag must not race to the same package version. Never cancel in flight: a run
# killed between push and completion is the one state that is genuinely hard to reason about.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================================
  # Gate. Publishing to nuget.org is irreversible — a version can be unlisted but never replaced
  # or re-pushed — so every test runs, on both compiler hosts, before anything is packed.
  # ===========================================================================================
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Same two legs as ci.yml, for the same reason: an analyzer is loaded by whatever
        # compiler host the consumer runs — .NET Framework under Visual Studio on Windows, .NET
        # under `dotnet build` anywhere. Shipping on one leg's word ships a pack that is broken
        # for half the people who install it.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        # Locked mode, as in ci.yml: the version being published resolves the graph the committed
        # lock files describe, or the release stops here.
        run: dotnet restore Rendlio.Analyzers.slnx --locked-mode

      - name: Build
        run: dotnet build Rendlio.Analyzers.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Rendlio.Analyzers.slnx --configuration Release --no-build --verbosity normal

  # ===========================================================================================
  # Pack, prove the package, publish. `needs: test` is what makes the gate above load-bearing:
  # a red test on either host means this job never starts, so nothing can be packed from a
  # commit that does not pass.
  #
  # "Prove the package" is two checks, and they answer different questions. The layout gate says the
  # package contains exactly the entries it ships — the analyzer at the one path NuGet reads, and
  # nothing else. The floor-host check installs it and watches both rules fire in the oldest
  # compiler host the packed README promises, which is the only way to learn that the assembly at
  # that path actually loads there. Both run on the commit being published rather than only on main:
  # a version on nuget.org can be unlisted but never replaced.
  #
  # Formatting is deliberately NOT re-gated here. `dotnet format --verify-no-changes` runs in
  # ci.yml on the commit that reached main; blocking a release on a cosmetic rule that cannot
  # affect the produced package would be a gate with no failure it protects against.
  # ===========================================================================================
  publish:
    name: publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets this job ask GitHub for the OIDC token it trades for a temporary nuget.org key.
      # Without it the token request fails and the login step has nothing to exchange.
      id-token: write

    env:
      # The lowest .NET SDK the README promises. Stated once for this job: the setup step installs
      # it and the floor check below runs against it, and a test in tests/Rendlio.Analyzers.Tests
      # fails the build if this stops matching the sentence on the README — which is the page packed
      # INTO the artifact this job pushes.
      SDK_FLOOR: '8.0.100'
      FRAMEWORK_FLOOR: net8.0

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Two SDKs. The pinned one builds and packs; the floor one hosts the consumer the floor check
      # installs into. global.json is named as well, so a bare `dotnet` in the worktree still
      # resolves the repository's pin rather than the older SDK.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.SDK_FLOOR }}
          global-json-file: global.json

      - name: Restore
        # Locked mode, as in ci.yml: the version being published resolves the graph the committed
        # lock files describe, or the release stops here.
        run: dotnet restore Rendlio.Analyzers.slnx --locked-mode

      - name: Resolve the version being released
        id: version
        env:
          # Read through the environment rather than interpolated into the script below:
          # `inputs.version` is attacker-controllable text on a public repository, and a `${{ }}`
          # inside a `run:` block is pasted into the shell before it ever runs.
          DISPATCH_VERSION: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            version="${DISPATCH_VERSION:-}"
          else
            version="${TAG#v}"
          fi

          # Checked before it reaches MSBuild or a shell command line, so everything downstream
          # is working with a known-shaped string rather than whatever was typed into a tag.
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${version}' is not a version. Tag a release as v<major>.<minor>.<patch>, e.g. v0.1.0."
            exit 1
          fi

          # The tag decides what the package is called; the project file decides what this commit
          # says it is. They have no way to disagree except by mistake, and the mistake — tagging
          # a version nobody bumped the project to — would publish a package whose own source
          # claims a different version. Prerelease suffixes live only on the tag, so compare the
          # release part.
          declared=$(dotnet msbuild src/Rendlio.Analyzers/Rendlio.Analyzers.csproj \
            -getProperty:VersionPrefix | tr -d '[:space:]')

          if [ "${version%%-*}" != "${declared}" ]; then
            echo "::error::Tagged ${version}, but Rendlio.Analyzers.csproj declares VersionPrefix ${declared}. Bump the project file and tag that commit."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${version}."

      - name: Build
        run: >
          dotnet build Rendlio.Analyzers.slnx --configuration Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}

      # Platform is passed for the reason ci.yml gives on the same step: packing the project
      # directly takes an ambient Platform as a global property and then looks for the build under
      # bin/<platform>/Release, which a solution build never wrote to. A no-op on a runner, and the
      # difference between this command working and failing NU5019 when it is run by hand.
      - name: Pack
        run: >
          dotnet pack src/Rendlio.Analyzers/Rendlio.Analyzers.csproj --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.version }} -p:Platform=AnyCPU --output ./artifacts

      - name: Verify the package contains exactly what it ships
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # By exact name, not a glob: this is also the check that the version actually landed on
          # the artifact rather than on a command line nobody read the effect of.
          nupkg="./artifacts/Rendlio.Analyzers.${VERSION}.nupkg"
          if [ ! -f "${nupkg}" ]; then
            echo "::error::Expected ${nupkg}; pack produced $(ls ./artifacts 2>/dev/null || echo 'nothing')."
            exit 1
          fi

          # The same script ci.yml runs, and the same one a release manager runs by hand against
          # the artifact a rehearsal uploaded. It asserts the package's ENTIRE entry list rather
          # than searching it for the path that matters most: analyzers/dotnet/cs is the only path
          # NuGet reads to install a C# analyzer, so a package missing it installs cleanly, reports
          # nothing, and is indistinguishable from a codebase with no violations — and a package
          # that has GAINED entries is the failure a search cannot see. Publishing is irreversible,
          # so this is the last moment either can be caught.
          bash eng/verify-package-layout.sh "${nupkg}"

      # Uploaded before the push so a dry run leaves the exact artifact a real release would have
      # published, for inspection.
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          if-no-files-found: error

      # The layout gate above proves the analyzer is at the path NuGet reads. Whether the assembly at
      # that path is loaded by a real compiler and reports anything is a different question, and the
      # README packed into this very artifact answers it with a promise: the lowest host it claims.
      # ci.yml runs this on main, which is not the same as running it on the commit being published.
      #
      # Placed AFTER the upload deliberately, unlike the layout gate. This step installs the package
      # and drives two builds, so it is the slowest thing here and the failure most worth having the
      # artifact in hand for — a rehearsal that fell over on the floor host and took the .nupkg with
      # it would leave nothing to diagnose. It still gates the push: every step below is a tag-push
      # step, and a failed step here stops the job before any of them.
      - name: Prove the analyzer loads and reports on the floor host
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: >
          bash eng/verify-host-floor.sh
          "./artifacts/Rendlio.Analyzers.${VERSION}.nupkg" "${SDK_FLOOR}" "${FRAMEWORK_FLOOR}"

      # A rehearsal needs no publishing identity, and the guard below is correctly scoped to a tag
      # push for that reason. The cost is that a green rehearsal says nothing about the one piece of
      # configuration a rehearsal exists to de-risk: NUGET_USER lives outside this repository, so it
      # is the setting most likely to be missing, and finding that out on the tag means re-cutting
      # it. Reported rather than enforced — a dry run that failed on an identity it does not use
      # would be a gate against nothing — so this reads the variable and says what a real tag would
      # do, without becoming a reason the rehearsal cannot finish.
      - name: Note whether a real release would find its publishing identity
        if: github.event_name == 'workflow_dispatch'
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NUGET_USER:-}" ]; then
            echo "::warning::Repository variable NUGET_USER is not set, so a real tag push would stop at 'Confirm the publishing identity is configured' and publish nothing. Everything this rehearsal checks has passed; set the variable under Settings > Secrets and variables > Actions > Variables before tagging."
          else
            echo "NUGET_USER is set, so a real tag push would reach the publish step."
          fi

      # ---- Everything below runs only for a tag push. -----------------------------------------
      - name: Confirm the publishing identity is configured
        if: github.event_name == 'push'
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        shell: bash
        run: |
          set -euo pipefail

          # A repository VARIABLE, not a secret — a nuget.org profile name is public, it just is
          # not guessable, and keeping it out of this file means it can be corrected without
          # editing the one file whose name the publishing policy pins. Checked here so an unset
          # variable fails with this sentence instead of as an opaque authentication error one
          # step later.
          if [ -z "${NUGET_USER:-}" ]; then
            echo "::error::Repository variable NUGET_USER is not set. Set it under Settings > Secrets and variables > Actions > Variables to the nuget.org profile name that owns the Trusted Publishing policy."
            exit 1
          fi

      - name: Exchange the OIDC token for a short-lived nuget.org key
        id: login
        if: github.event_name == 'push'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: github.event_name == 'push'
        env:
          # Through the environment, for the reason stated above the version step: a `${{ }}` in a
          # `run:` block is pasted into the shell before it runs. `NuGet/login` registers the key
          # for masking so it does not reach the log either way — but the credential should not be
          # the one exception to the rule this file states.
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "./artifacts/Rendlio.Analyzers.${VERSION}.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json
